<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Journey to the Thingamajig</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			overflow: hidden;
			background-color: #000000;
		}
		body {
			display: flex;
			justify-content: center;
			align-items: center;
		}
		#content {
			width: 800px;
			height: 400px;
		}
		canvas {
			image-rendering: optimizeSpeed;
			image-rendering: -moz-crisp-edges;
			image-rendering: -o-crisp-edges;
			image-rendering: -webkit-optimize-contrast;
			image-rendering: optimize-contrast;
			image-rendering: crisp-edges;
			image-rendering: pixelated;
			-ms-interpolation-mode: nearest-neighbor;
		}
	</style>
</head>
<body>
	<noscript>This page requires JavaScript to run the game.</noscript>
	<div id="content">
		<p style="color: white; text-align: center;">
			Loading Journey to the Thingamajig...<br><br>
			<em>Note: Build files need to be deployed from export/html5/bin/<br>
			Run the deployment script to copy build files here.</em>
		</p>
	</div>

	<!-- HaxeFlixel/OpenFL game scripts will be added here by the build process -->
	<!-- When deployed, this file will be replaced with the one from export/html5/bin/ -->
</body>
</html>
